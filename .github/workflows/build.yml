name: Build and test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libpoppler-qt6-dev qt6-tools-dev qt6-l10n-tools
      - name: Build and test
        run: make test BUILD_TYPE=Debug
      - name: Install and clean
        run: make install clean BUILD_TYPE=Debug PREFIX="$RUNNER_TEMP/nightreader"
